# TeslaPilot fork-safety gate.
# comma docs/SAFETY.md: disable/nerf driver monitoring or excessive-actuation
# checks, or ship modified opendbc/safety without the full test suite, and
# comma will ban the dongle from their servers.
#
# This workflow fails the PR if Highland touches those paths relative to the
# merge-base with commaai/openpilot (and commaai/opendbc for the safety pack),
# except the reviewed TITS diff, pinned file by file (base and head blob) in
# .github/fork-safety/*.allow. It also runs comma's safety tests and MISRA.
# Refresh an allowlist only after review: .github/fork-safety/check.sh print BASE PATH...
name: fork-safety

on:
  push:
    branches: [master, release, Highland, Highland-Dev]
  pull_request:
  workflow_dispatch:

jobs:
  safety-paths:
    name: safety-critical paths unchanged
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Fetch commaai/openpilot
        run: |
          git remote add comma https://github.com/commaai/openpilot.git
          git fetch comma master --depth=200

      - name: Driver monitoring and excessive-actuation checks must match comma, except the pinned TITS diff
        run: |
          set -euo pipefail
          BASE=$(git merge-base comma/master HEAD || git rev-parse comma/master)
          echo "base with commaai/openpilot master: $BASE"
          .github/fork-safety/check.sh check "$BASE" .github/fork-safety/openpilot.allow \
            openpilot/selfdrive/monitoring \
            openpilot/selfdrive/selfdrived/helpers.py

      - name: opendbc/safety must match comma, except the pinned TITS diff
        working-directory: opendbc_repo
        run: |
          set -euo pipefail
          git remote add comma https://github.com/commaai/opendbc.git || true
          git fetch comma master --depth=200
          BASE=$(git merge-base comma/master HEAD)
          echo "merge-base with commaai/opendbc master: $BASE"
          ../.github/fork-safety/check.sh check "$BASE" ../.github/fork-safety/opendbc.allow opendbc/safety

      - name: panda submodule stays commaai/panda
        run: |
          set -euo pipefail
          grep -E 'url = .*/commaai/panda.git' .gitmodules
          echo "panda submodule URL is stock commaai/panda"

  opendbc-safety-tests:
    name: comma safety tests (100% coverage) and MISRA
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: comma test.sh (UBSan, coverage, 100% line gate)
        run: opendbc_repo/opendbc/safety/tests/test.sh

      - name: MISRA
        run: opendbc_repo/opendbc/safety/tests/misra/test_misra.sh
