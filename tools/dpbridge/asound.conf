# dpbridge: the mici card has one playback PCM (MultiMedia1), so soundd (default) and A2DP music share it through
# dmix. Music alone passes a softvol control that dpb_a2dp uses to mute and duck; alerts never pass it.
# Capture stays on sysdefault, exactly what default was before, so micd is untouched.
# Only active while deliver.sh enable links it to /etc/asound.conf.
pcm.dpb_mix {
  type dmix
  ipc_key 5791
  ipc_perm 0666
  slave { pcm "hw:0,0" rate 48000 channels 2 period_size 1024 buffer_size 8192 }
}
pcm.!default { type asym playback.pcm "plug:dpb_mix" capture.pcm "sysdefault" }
ctl.!default { type hw card 0 }
pcm.dpb_a2dp_vol {
  type softvol
  slave.pcm "dpb_mix"
  control { name "dpbridge A2DP Playback Volume" card 0 }
  min_dB -51.0
  max_dB 0.0
}
pcm.dpb_a2dp { type plug slave.pcm "dpb_a2dp_vol" }
