# dpbridge: bluealsa-aplay only (ALSA_CONFIG_PATH in its unit). A2DP goes to a FIFO that soundd mixes under alerts.
# soundd and micd keep the stock config; nothing links this to /etc/asound.conf.
pcm.dpb_a2dp {
  type plug
  slave {
    pcm { type file file "/run/dpbridge/a2dp.fifo" format raw slave.pcm "null" }
    format S16_LE
    channels 1
    rate 48000
  }
}
